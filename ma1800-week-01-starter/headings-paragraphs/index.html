<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Headings and Paragraphs</title>
  <style>
  p {
    color: crimson;
  }
  </style>
</head>
<body>
  <h1>This is my heading.</h1>
  <h3>This is another one.</h3>
  <p>This is my paragraph.</p>
  <hr>
<p>Well, there is a man here.</p>
<p>He might be happy to see you.</p>
<p style="font-weight: bold">Yes &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;No</p>
<p>You got the Egg.</p>
<p>...</p>
<p>Well, there is not a man here.</p>
</body>
</html>
